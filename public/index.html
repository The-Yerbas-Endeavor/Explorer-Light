<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lightweight Yerbas blockchain explorer">
  <title>Yerbas Explorer Light</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Yerbas Explorer Light home">
      <span class="leaf">🌿</span>
      <span><strong>YERBAS</strong><small>EXPLORER LIGHT</small></span>
    </a>
    <span id="rpc-state" class="status-pill">Connecting…</span>
  </header>

  <main class="shell">
    <section class="hero">
      <p class="eyebrow">RPC-FIRST · DATABASE-FREE</p>
      <h1>Explore the Yerbas blockchain.</h1>
      <p class="subhead">Blocks and transactions come directly from Yerbas Core. No MongoDB required.</p>
      <form id="search-form" class="search" role="search">
        <input id="search-input" autocomplete="off" spellcheck="false" placeholder="Block height, block hash, transaction ID, or Yerbas address" aria-label="Search Yerbas blockchain">
        <button type="submit">Search</button>
      </form>
      <div id="notice" class="notice hidden" role="status"></div>
    </section>

    <div id="app" aria-live="polite">
      <section class="loading-card">Loading Yerbas blockchain data…</section>
    </div>
  </main>

  <footer>
    <span>Yerbas Explorer Light</span>
    <span>Blockchain = source of truth · Explorer DB = none</span>
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
